# Scripted answers for `--model mock --mock-rules examples/mock_rules.yaml`.
# Lets you exercise the whole pipeline offline. Some answers are deliberately wrong or
# badly formatted so that reports and failure clusters have something to show.
default: "I'm not sure."
rules:
  - pattern: "14 pens"
    response: "Each pen is $3, so 14 x 3 = 42.\n42"
  - pattern: "17% of 250"
    response: "17% of 250 is 42.5"
  - pattern: "180 km"
    response: "Speed = 180 / 2.5 = 72 km/h. Let me know if you need anything else!"
  - pattern: "x \\+ 2x \\+ 3x"
    response: "6x = 48 so x = 6"
  - pattern: "3 boxes of 12"
    response: "36 - 5 = 31"
  - pattern: "1 to 20"
    response: "The sum is 20 * 21 / 2 = 200"
  - pattern: "Reverse the string: (\\w+)"
    response: "Sure! The reversed string is:\n\"noitaulave\""
  - pattern: "snake_case"
    response: "parse_http_response_code"
  - pattern: "vowels"
    response: "There are 4 vowels."
  - pattern: "alphabetically"
    response: "apple, mango, pear"
  - pattern: "capital of Australia"
    response: "The capital is Sydney."
  - pattern: "is_palindrome"
    response: "```python\nimport re\n\ndef is_palindrome(s):\n    t = re.sub(r'[^a-z0-9]', '', s.lower())\n    return t == t[::-1]\n```"
  - pattern: "fizzbuzz"
    response: "```python\ndef fizzbuzz(n):\n    out = []\n    for i in range(1, n + 1):\n        if i % 3 == 0:\n            out.append('Fizz')\n        elif i % 5 == 0:\n            out.append('Buzz')\n        else:\n            out.append(str(i))\n    return out\n```"
  - pattern: "chunk\\("
    response: "```python\ndef chunk(xs, n):\n    return [xs[i:i + n] for i in range(0, len(xs), n)]\n```"
  - pattern: "Priya"
    response: "{\"name\": \"Priya\", \"age\": 29, \"city\": \"Pune\"}"
  - pattern: "Tom \\(41\\)"
    response: "Here you go: {\"name\": \"Tom\", \"age\": \"41\", \"city\": \"Leeds\"}"
  - pattern: "invoice total"
    response: "{\"total\": \"1,250.00\", \"currency\": \"EUR\"}"
